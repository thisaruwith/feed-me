services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=feedme
      - POSTGRES_PASSWORD=feedme_dev_password
      - POSTGRES_DB=feed_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    environment:
      - CLIENT_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://feedme:feedme_dev_password@postgres:5432/feed_me?schema=public
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
